# Include only inside commerce.aicbec.cn's TLS server block.
# The core API, UI and OAuth callback retain their existing upstreams.
location ^~ /api/v1/development/localization/shops/ {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:4110;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 45s;
    proxy_hide_header X-Powered-By;
}
location = /api/v1/development/localization/health {
    proxy_pass http://127.0.0.1:4110;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 45s;
    proxy_hide_header X-Powered-By;
}
