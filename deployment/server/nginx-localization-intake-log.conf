# Install in /etc/nginx/conf.d/ (http context), before the site snippet is loaded.
# Deliberately omit query strings, headers, cookies, IPs and request/response bodies.
log_format yz_localization_intake escape=json
    '{"time":"$time_iso8601","trace":"$request_id",'
    '"apiTrace":"$upstream_http_x_request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"upstream":"$upstream_status",'
    '"duration":"$request_time"}';
