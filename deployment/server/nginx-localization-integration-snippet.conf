# Include in commerce.aicbec.cn's TLS server; retain existing login, shops and OAuth routing.
# Requires nginx-localization-intake-log.conf in the http context.
location = /api/v1/localization/integration/imports {
    client_max_body_size 12m;
    access_log /var/log/nginx/yz-localization-intake.log yz_localization_intake;
    proxy_pass http://127.0.0.1:4111;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 100s;
    proxy_hide_header X-Powered-By;
}
location ^~ /api/v1/development/localization/imports {
    proxy_pass http://127.0.0.1:4111;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 45s;
    proxy_hide_header X-Powered-By;
}
location ^~ /api/v1/localization/ {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:4111;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 100s;
    proxy_hide_header X-Powered-By;
}
location ^~ /api/v1/settings/ai {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:4111;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 45s;
}
# Selection uses the same authenticated console and draft store as localization.
location = /tools/selection {
    proxy_pass http://127.0.0.1:3110;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
}
location = /tools/localization {
    proxy_pass http://127.0.0.1:3110;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
}
location = /settings/ai {
    proxy_pass http://127.0.0.1:3110;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
}
# Both old and review-console hashed assets are assembled into this immutable overlay.
location ^~ /_next/static/ {
    root /opt/yz-commerce/localization-integration/current/web-assets;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

# Listing uploads contain the primary image and optional product documents.
location ^~ /api/v1/listing/jobs {
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 150s;
    proxy_hide_header X-Powered-By;
}
