# Include inside commerce.aicbec.cn TLS server.
# Use the authenticated normal API, not the historical save-only test service.
location ^~ /api/v1/development/localization/shops/ {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 150s;
    proxy_hide_header X-Powered-By;
}
location = /api/v1/development/localization/health {
    proxy_pass http://127.0.0.1:4100/api/v1/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 45s;
    proxy_hide_header X-Powered-By;
}
