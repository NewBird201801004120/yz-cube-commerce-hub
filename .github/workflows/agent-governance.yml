name: Agent governance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('Cargo.toml') != ''
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('bun.lock', 'bun.lockb') != ''
      - run: corepack enable
        if: hashFiles('pnpm-lock.yaml', 'yarn.lock') != ''
      - name: Resolve verification base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BASE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              HEAD_PARENTS="$(git show -s --format=%P HEAD)"
              if [ -n "$HEAD_PARENTS" ]; then
                BASE="HEAD^"
              else
                BASE="$(git hash-object -w -t tree /dev/null)"
              fi
            fi
          fi
          echo "AEG_BASE=$BASE" >> "$GITHUB_ENV"
      - name: Policy check before dependency installation
        run: node .agent/scripts/cli.mjs install --root .
      - name: Effective risk verification (basic or configured trusted mode)
        run: node .agent/scripts/cli.mjs verify --root . --base "$AEG_BASE"
